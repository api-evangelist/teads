apis:
- name: Teads Conversions API
  description: >-
    Server-side API for sending advertiser conversion events (Purchase, AddToCart,
    Lead, ViewContent, etc.) to Teads for measurement and optimization, using a
    Conversion API Token generated in Teads Ad Manager. Complements the browser
    Teads Pixel with first-party cookie identifiers (tfpai/tfpvi/tfpsi).
  humanURL: https://developers.teads.com/
  baseURL: https://ca.teads.tv
  tags:
  - Conversions
  - Measurements
  - Server-Side Events
  tags_raw:
  - Conversions
  - Measurement
  - Server-Side Events
  properties:
  - type: Documentation
    url: https://developers.teads.com/
  - type: x-integration-guide
    url: https://docs.tealium.com/server-side-connectors/teads-conversions-connector/
- name: Teads In-Chat API
  description: >-
    V2.0 REST API that lets chatbot and LLM publishers programmatically retrieve
    contextually relevant sponsored and organic ad recommendations and inject them
    into conversational interfaces, authenticated with a Partner API Key and
    driven by chat context, keywords, and IAB categories.
  humanURL: https://developers.teads.com/docs/Chatbot-AI-SDK/Getting-Started/integration-guide/
  baseURL: https://mv.outbrain.com/Multivac/api/in-chat-recs
  tags:
