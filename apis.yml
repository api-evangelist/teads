aid: teads
name: Teads
description: >-
  Teads is an omnichannel advertising technology platform (combined with Outbrain
  since 2024) that helps brands reach audiences across video, display, CTV, and
  conversational surfaces on 10,000+ premium publisher properties in 50+ markets.
  For developers and advertisers Teads exposes a server-side Conversions API for
  privacy-safe conversion event delivery, an In-Chat Recommendations API (V2.0)
  for injecting contextual ad recommendations into chatbots and LLM experiences,
  and first-party mobile ad SDKs for iOS, Android, React Native, and Flutter used
  to build premium outstream inventory inside apps. This profile catalogs those
  developer-facing surfaces for API discovery.
