  installation_keys:
  - NANOWDGT01
  - TESTKEY01
  source: https://developers.teads.com/docs/iOS-SDK/Getting-Started/test-pids/
- family: Recommendations API placements
  kind: test configuration
  article_url: https://test-demo.outbrain.com
  widget_ids:
  - SDK_1
  - RECS_1
  - TEST_RECS
  installation_keys:
  - NANOWDGT01
  - TESTKEY01
  source: https://developers.teads.com/docs/iOS-SDK/Getting-Started/test-pids/
- family: Interstitial placements (AdMob / GAM mediation)
  kind: test configuration
  article_url: https://mobile-demo.outbrain.com
  widget_ids:
  - INT_MW_1
  installation_keys:
  - NANOWDGT01
  source: https://developers.teads.com/docs/iOS-SDK/Getting-Started/test-pids/
- family: In-Chat Recommendations API
  kind: example widget id
  widget_ids:
  - APP_12
  - APP_16
  note: >-
    Documented as example widgetJSId values; a production widget id is issued by
    a Teads account representative. Each widget id fixes the recommendation count
    and image size.
  source: https://developers.teads.com/docs/Chatbot-AI-SDK/Getting-Started/integration-guide/
validation_tooling:
- name: Teads SDK Validation Tool
  url: https://developers.teads.com/docs/iOS-SDK/Troubleshooting/validation-tool/
  session_host: sdkvalidation.teads.tv
  scope: Teads Media (video) placements only
  not_supported:
  - Media Native placements
  - Feed placements
  - Recommendations API
  checks:
  - Page/article URL valid (brand safety)
  - GDPR / CCPA / GPP consent signals provided
  - SDK version is current
  - app-ads.txt includes teads.tv
  - Teads tracking sent and received
  - Media playback completes
  - Creative resize supported
  note: >-
    Runs a fixed landscape video creative regardless of PID; the session URL is
    printed to the IDE log and opened on a desktop browser.
health_endpoints:
- url: https://ca.teads.tv/health
  status: 200
  body: server is up
  probed: '2026-08-13'
  note: >-
    Unauthenticated liveness endpoint on the Conversions API host. Not documented
    by Teads; recorded here because it was observed live.
warnings:
- >-
  Teads marks the test PIDs and configurations "for development and testing
  purposes only. Never use them in your production environment."
- >-
  Validation/debug mode must be disabled before a production release.
