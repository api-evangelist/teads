generated: '2026-08-13'
method: searched
source: https://developers.teads.com/docs/iOS-SDK/Getting-Started/test-pids/
description: >-
  Teads publishes a real test surface for its developer products. There is no
  separate sandbox HOST — testing runs against the production endpoints using
  provider-published test placement identifiers, test widget/installation keys,
  a testMode request flag, and a hosted Validation Tool session that grades a
  live integration. Every value below is published verbatim by Teads in its
  developer documentation.
mode:
  separate_host: false
  note: >-
    No sandbox base URL exists. The In-Chat Recommendations API is exercised on
    the production endpoint with testMode=true; the mobile SDKs are exercised on
    production with Teads-issued test PIDs.
environments:
- name: Development
  purpose: Local testing / QA
  note: Use testMode=true to avoid polluting production reporting.
  source: https://developers.teads.com/docs/Chatbot-AI-SDK/Features/settings/
- name: Staging
  purpose: Pre-production validation
  note: Uses the same endpoint as production with limited traffic.
  source: https://developers.teads.com/docs/Chatbot-AI-SDK/Features/settings/
- name: Production
  purpose: Live traffic and monetization
  note: Requires an approved API key and an approved placement.
  source: https://developers.teads.com/docs/Chatbot-AI-SDK/Features/settings/
test_modes:
- api: Teads In-Chat Recommendations API
  flag: testMode
  location: query parameter
  values:
  - 'true'
  env_var: TEADS_TEST_MODE
  example_url: >-
    https://mv.outbrain.com/Multivac/api/in-chat-recs?key=YOUR_KEY&contentUrl=test.com&widgetJSId=APP_12&cors=true&testMode=true
  source: https://developers.teads.com/docs/Chatbot-AI-SDK/Features/settings/
- api: Teads Mobile SDKs (iOS / Android)
  flag: enableDebug() / validation mode on TeadsAdPlacementSettings
  note: >-
    Debug + validation mode must be removed before shipping to production; the
    docs warn about this explicitly.
  source: https://developers.teads.com/docs/iOS-SDK/Troubleshooting/validation-tool/
test_placements:
- family: Media (video) placements
  kind: test PID
  values:
  - id: '84242'
    description: Landscape creatives only
  - id: '127546'
    description: Vertical creatives only
  - id: '127547'
    description: Square creatives only
  - id: '128779'
    description: Carousel creatives only
  - id: '128780'
    description: Multiple creative sizes and formats
  source: https://developers.teads.com/docs/iOS-SDK/Getting-Started/test-pids/
- family: Media Native placements
  kind: test PID
  values:
  - id: '124859'
    description: Display creatives only; native video ads with custom rendering
  source: https://developers.teads.com/docs/iOS-SDK/Getting-Started/test-pids/
- family: Feed placements
  kind: test configuration
  article_url: https://test-demo.outbrain.com
  widget_ids:
  - MB_1
