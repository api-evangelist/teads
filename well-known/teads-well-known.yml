description: >-
  Probe of the standard .well-known discovery surface plus /llms.txt across every
  host this provider names — the developer portal, the Conversions API host, the
  In-Chat Recommendations API host, and the corporate site. ONE real document was
  found: an RFC 9116 security.txt served for mv.outbrain.com (the documented
  In-Chat API host), which 302s to the same document on www.outbrain.com.
  Outbrain and Teads are the same company — Outbrain Inc. acquired Teads in 2025
  and the combined business operates under the Teads brand — so that host is this
  provider's own. Everything else 404s, or is refused with 406 by the WAF in
  front of www.teads.com / www.outbrain.com for any non-HTML request.
  No agent card, no OpenID/OAuth discovery, no api-catalog, no ai-plugin.
