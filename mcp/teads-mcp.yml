generated: '2026-08-13'
method: searched
status: announced-not-shipped
source: https://developers.teads.com/docs/Chatbot-AI-SDK/Examples/sdk-mcp-coming-soon/
description: >-
  Teads has PUBLICLY ANNOUNCED an MCP integration but has not shipped it. Its
  developer portal carries a page titled "Teads AI Chatbot SDK — MCP Integration
  (Coming Soon)" with "Planned Release: 2026" and "Status: In Development",
  describing an MCP server that would front the Teads Measurement, Publisher
  (Organic) and Marketer (Paid) APIs behind one endpoint so that keys stay
  server-side. There is no endpoint, no manifest, no package and no registry
  listing today. Access to the MCP Developer Beta is requested from a Teads
  Partner Manager or ai-sdk@teads.com.
  The tools[] block below is a CANDIDATE surface derived from Teads' two
  documented REST APIs plus the one action name Teads itself illustrates
  ("getOrganic"). It is a design sketch, NOT something Teads publishes, and no
  MCPServer pointer is emitted in apis.yml for this provider.
