  vendor_status: In Development
  beta_contact: ai-sdk@teads.com
  architecture_claimed: >-
    GPT / AI agent -> MCP Server (Teads Connector) -> Teads Measurement API,
    Teads Publisher (Organic) API, Teads Marketer (Paid) API.
  vendor_example_call: |
    {"action": "getOrganic", "parameters": {"contentUrl": "https://example.com/page"}}
  vendor_claims:
  - Unified context layer across multiple GPTs and agents through one endpoint
  - Sensitive keys remain server-side, managed by a proxy layer
  - Zero-config GPT integration via a single manifest file
  - Multi-agent access to shared measurement and content signals
