recommendation: >-
  This is the single highest-leverage agent-readiness move available to Teads.
  They already ship a conversational-AI ad product whose customers are LLM
  publishers, and they have designed the MCP layer publicly. Shipping the
  announced endpoint would turn an announcement into a callable agent surface.
